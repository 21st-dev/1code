name: Package Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package-windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        env:
          LOCUS_SKIP_POSTINSTALL: "1"
        run: bun install --frozen-lockfile

      - name: Rebuild Electron native modules
        run: bun run native:rebuild

      - name: Download bundled agent binaries
        run: |
          node scripts/download-claude-binary.mjs --version=2.1.153 --platform win32-x64
          node scripts/download-codex-binary.mjs --version=0.134.0 --platform win32-x64

      - name: Build app
        run: bun run build

      - name: Package Windows x64
        run: bun run package:win -- --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: locus-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
