<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
    <title>Agent Code for Me - Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Dark theme (default) */
      :root {
        --bg: #09090b;
        --text: #fafafa;
        --text-logo: #fafafa;
        --btn-shadow: 0 0 0 0.5px rgb(23,23,23), inset 0 0 0 1px rgba(255,255,255,0.14);
      }

      /* Light theme */
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --text: #09090b;
          --text-logo: #09090b;
          --btn-shadow: 0 0 0 0.5px rgba(0,0,0,0.1), inset 0 0 0 1px rgba(0,0,0,0.1);
        }
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        -webkit-app-region: drag;
      }
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        -webkit-app-region: no-drag;
      }
      .logo {
        height: 72px;
        width: auto;
      }
      .logo .brand-mark {
        stroke: var(--text-logo);
      }
      .logo .brand-spark,
      .logo .brand-text {
        fill: var(--text-logo);
      }
      .login-btn {
        height: 32px;
        padding: 0 12px;
        background: hsl(228 100% 50%);
        color: #fafafa;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: background-color 0.15s ease, transform 0.15s ease;
        box-shadow: var(--btn-shadow);
      }
      .login-btn:hover {
        background: hsl(228 100% 45%);
      }
      .login-btn:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <svg class="logo" viewBox="0 0 250 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g class="brand-mark" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 24.5C8 19.8 11.8 16 16.5 16H31C35.2 16 37.7 18.1 40 21.7L42.5 25.5"/>
          <path d="M31.5 43H16.5C11.8 43 8 39.2 8 34.5V24.5"/>
          <path d="M41 24.5C44.1 21.1 47.8 19.5 52 19.5C56.4 19.5 60 23.1 60 27.5V39.5C60 43.9 56.4 47.5 52 47.5H47.5L39.5 54V47.5H37.5C33 47.5 29.7 45.2 28.5 41.4"/>
          <path d="M16.5 27.5L22 33L16.5 38.5"/>
          <path d="M23.5 38.5H29.5"/>
          <path d="M45 29.5H53"/>
          <path d="M44 36H53"/>
        </g>
        <path class="brand-spark" d="M39.5 6L41.2 10.8L46 12.5L41.2 14.2L39.5 19L37.8 14.2L33 12.5L37.8 10.8L39.5 6Z"/>
        <text class="brand-text" x="76" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="650">Agent Code for Me</text>
      </svg>
      <button class="login-btn" id="loginBtn">Sign in</button>
    </div>
    <script>
      console.log('Login page loaded');
      console.log('window.desktopApi:', window.desktopApi);

      // Listen for auth success from main process (via deep link)
      // This ensures UI updates even if deep link arrives before click handler completes
      if (window.desktopApi && window.desktopApi.onAuthSuccess) {
        window.desktopApi.onAuthSuccess(function(user) {
          console.log('[Login] Auth success received:', user?.email);
          // Window will be reloaded by main process, no UI change needed
        });
      }

      document.getElementById('loginBtn').addEventListener('click', function() {
        console.log('Sign in clicked');
        console.log('desktopApi available:', !!window.desktopApi);

        if (window.desktopApi && window.desktopApi.startAuthFlow) {
          console.log('Calling startAuthFlow...');
          window.desktopApi.startAuthFlow();
        } else {
          console.error('Desktop API not available');
          alert('Desktop API not available. Please restart the app.');
        }
      });
    </script>
  </body>
</html>
